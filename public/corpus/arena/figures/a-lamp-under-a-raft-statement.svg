<title id="t">Lamp under a floating raft</title>
<desc id="d">Side view of a lake. A lamp sits at depth h in water of refractive index n, directly below the centre of a floating raft of radius R. A ray from the lamp reaches the surface at the rim of the raft, at the critical angle to the normal, and is reflected back down into the water.</desc>
