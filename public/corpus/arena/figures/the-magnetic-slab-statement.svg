<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">
<title id="t">Particle crossing a slab of magnetic field</title>
<desc id="d">A slab of thickness d holds a uniform magnetic field B that points out of the page. A particle of mass m and charge q enters at right angles to the left face with speed v, follows a circular arc and leaves through the right face, turned by an angle theta.</desc>
