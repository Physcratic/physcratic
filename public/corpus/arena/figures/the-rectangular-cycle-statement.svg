<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">
<title id="t">Rectangular cycle on a pressure and volume diagram</title>
<desc id="d">Pressure p is on the vertical axis and volume V on the horizontal axis. The cycle is a rectangle with corners A at volume V0 and pressure p0, B at V0 and 2 p0, C at 3 V0 and 2 p0, and D at 3 V0 and p0. Arrows run from A to B to C to D and back to A.</desc>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker>
<marker id="tipb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker>
</defs>
<rect x="1" y="1" width="558" height="298" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M70 250H510" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#tip)"/>
<path d="M70 250V36" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#tip)"/>
<text x="518" y="255" font-style="italic" >V</text>
<text x="52" y="40" font-style="italic" >p</text>
<path d="M70 170H180M70 90H180M180 250V170M400 250V170" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
<path d="M180 170V90H400V170Z" stroke="#1d4ed8" stroke-width="2.5" fill="none"/>
<path d="M180 150L180 122" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#tipb)"/>
<path d="M270 90L300 90" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#tipb)"/>
<path d="M400 110L400 138" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#tipb)"/>
<path d="M310 170L280 170" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#tipb)"/>
<circle cx="180" cy="170" r="4" fill="#0f172a"/>
<text x="158" y="192" font-weight="bold">A</text>
<circle cx="180" cy="90" r="4" fill="#0f172a"/>
<text x="158" y="82" font-weight="bold">B</text>
<circle cx="400" cy="90" r="4" fill="#0f172a"/>
<text x="410" y="82" font-weight="bold">C</text>
<circle cx="400" cy="170" r="4" fill="#0f172a"/>
<text x="410" y="192" font-weight="bold">D</text>
<text x="34" y="175" font-style="italic" >p<tspan font-style="normal" font-size="12" dy="4">0</tspan></text>
<text x="26" y="95" >2<tspan font-style="italic">p</tspan><tspan font-size="12" dy="4">0</tspan></text>
<text x="170" y="272" font-style="italic" >V<tspan font-style="normal" font-size="12" dy="4">0</tspan></text>
<text x="384" y="272" >3<tspan font-style="italic">V</tspan><tspan font-size="12" dy="4">0</tspan></text>
</svg>
