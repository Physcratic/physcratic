name: Authored student browser

on:
  pull_request:
    paths:
      - 'components/authoring/editor-fields.tsx'
      - 'components/authored/**'
      - 'tests/authored-student.browser.mjs'
      - 'tests/authored-student-harness.tsx'
      - 'lib/authored-*.ts'
      - 'lib/problem-authoring*.ts'
      - 'app/globals.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/authored-student-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_authoring_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTHORING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/authored-browser-tools" --no-audit --no-fund playwright@1.64.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/authored-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Authored problem student and responsive maths regression
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/authored-browser-tools
        run: node --require ./tests/server-only-register.cjs --import tsx tests/authored-student.browser.mjs
