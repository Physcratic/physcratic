name: Local CSP harness
on:
  pull_request:
    paths:
      # HTML, scripts, shared rendering/validation and policy dependencies.
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.*'
      - 'middleware.*'
      - 'proxy.*'
      - 'vercel.json'
      - 'src/**'
      - '.github/workflows/ci.yml'
      - '*config*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.node-version'
      - '.nvmrc'
      - 'tests/**'
      - 'scripts/csp/**'
      - '.github/workflows/csp-harness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install external test tools and all three engines
        run: |
          npm install --prefix "$RUNNER_TEMP/csp-tools" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/csp-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Focused CSP regression tests
        run: node --require ./tests/server-only-register.cjs --import tsx --test tests/csp-*.test.ts lib/security-csp*.test.ts
      - name: Build with synthetic environment and server egress guard
        run: node --import tsx scripts/csp/local.mjs --build
      - name: Compare report-only and actual local enforcement
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/csp-tools
          CSP_REQUIRE_ALL: '1'
        run: node --import tsx scripts/csp/browser.mjs
      - name: Inventory and qualify hybrid HTML coverage (fail closed)
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/csp-tools
          CSP_REQUIRE_ALL: '1'
        run: node --import tsx scripts/csp/architecture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-csp-results
          path: build/csp/
          retention-days: 7
