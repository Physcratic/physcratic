name: Public problem library browser
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.github/workflows/public-library-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_library_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VERCEL_ENV: production
      NEXT_PUBLIC_SITE_URL: https://physcratic.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: External browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/library-tools" --no-audit --no-fund playwright@1.64.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/library-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Production build with synthetic configuration
        env:
          BETTER_AUTH_SECRET: ci-build-only-physcratic-synthetic-secret-0000000000000000
          BETTER_AUTH_URL: http://127.0.0.1:3101
        run: pnpm build
      - name: Public library, archive, no-JS, accessibility and real session isolation
        env:
          DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_library_test
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/library-tools
          HOME_LIBRARY_BROWSER: '1'
          HOME_ARCHIVE_BROWSER: '1'
          HOME_TOPIC_BROWSER: '1'
          TOPIC_SCREENSHOTS: ${{ runner.temp }}/library-screenshots/topics
          ARCHIVE_SCREENSHOTS: ${{ runner.temp }}/library-screenshots/archive
          LIBRARY_SCREENSHOTS: ${{ runner.temp }}/library-screenshots
        run: pnpm exec tsx --conditions=react-server tests/home-session.live.mts
      - name: Desktop and mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-library-screenshots
          path: ${{ runner.temp }}/library-screenshots
          if-no-files-found: warn
