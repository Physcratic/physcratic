name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: Unit tests
        shell: bash
        # *.pg.test.ts need Postgres; a DB job can come later.
        # lib/corpus-translation.test.ts test 64 is marked todo in the file (inherited corpus punctuation drift; remove todo after PR #2 merges).
        run: pnpm exec tsx --conditions=react-server --test $(ls lib/*.test.ts | grep -v '\.pg\.test\.ts$')

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_authoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service container only. Never set DATABASE_URL here.
      AUTHORING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Database tests
        shell: bash
        run: |
          files=$(grep -l AUTHORING_TEST_DATABASE_URL lib/*.test.ts || true)
          if [ -z "$files" ]; then
            echo "No test files reference AUTHORING_TEST_DATABASE_URL, nothing to run."
            exit 0
          fi
          echo "Running:"
          echo "$files"
          pnpm exec tsx --conditions=react-server --test $files
