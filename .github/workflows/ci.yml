name: CI

on:
  pull_request:
  push:
    branches: [main, codex/physcratic-authoring-completion]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Offline isolation guards
        run: python3 -B scripts/phase-c-offline/run.py safety
      - name: Typecheck
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm lint --max-warnings=0
      - name: Unit tests
        run: pnpm run test:server
      - name: Component rendering tests
        run: pnpm test:ui
      - name: Production build
        env:
          # Synthetic build-only values; no live service credentials.
          BETTER_AUTH_SECRET: ci-build-only-physcratic-synthetic-secret-0000000000000000
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_authoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service container only. Never set DATABASE_URL here.
      AUTHORING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
      AUTHORING_TEST_EXPECTED_VERSION: "18.6"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Database tests
        shell: bash
        run: |
          files=$(grep -l AUTHORING_TEST_DATABASE_URL lib/*.test.ts | grep -v '^lib/production-upgrade.pg.test.ts$' || true)
          if [ -z "$files" ]; then
            echo "No test files reference AUTHORING_TEST_DATABASE_URL, nothing to run."
            exit 0
          fi
          echo "Running:"
          echo "$files"
          pnpm exec tsx --conditions=react-server --test $files
      - name: Reviewed authoring release package and transport guards
        run: |
          mkdir -p work/neon-release-audit
          (cd scripts/authoring-release && sha256sum -c PACKAGE_SHA256SUMS)
          node --test scripts/authoring-release/release.test.mjs
          pnpm exec tsx --conditions=react-server --test scripts/authoring-release/mail-audit.test.ts lib/author-media-storage.test.ts
      - name: Production operator package and rejection guards
        run: |
          (cd scripts/authoring-release-production && sha256sum -c PACKAGE_SHA256SUMS)
          node --test scripts/authoring-release-production/core.test.mjs

  b6-database:
    name: B6 PostgreSQL 18.7 operator test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_authoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
      DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: B6 integrity and operator tests
        run: pnpm exec tsx --conditions=react-server --test lib/production-upgrade.test.ts lib/production-upgrade.pg.test.ts
