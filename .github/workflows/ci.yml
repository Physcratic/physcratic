name: CI

on:
  pull_request:
  push:
    branches: [main, codex/physcratic-authoring-completion]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, PostgreSQL tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_authoring_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d physcratic_authoring_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Uses the exact packageManager version in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm lint --max-warnings=0
      - name: Full unit and disposable PostgreSQL integration tests
        env:
          # CI service only; never a shared/production DATABASE_URL or secret.
          AUTHORING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
        run: pnpm test
      - name: Production build (local licensed Inter; no live font download)
        run: pnpm build
      # Browser harnesses additionally require Playwright, axe and Chromium.
      # They remain explicit local checks; no browser run is claimed by this job.
