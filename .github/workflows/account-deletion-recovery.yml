name: Account deletion recovery
on:
  pull_request:
    paths:
      - '.github/workflows/account-deletion-recovery.yml'
      - 'migrations/**'
      - 'scripts/account-deletion-authorization/**'
      - 'scripts/account-deletion-restore/**'
      - 'scripts/authoring-release-production/package/test-fixture.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  isolated-restore:
    name: Isolated restore after an interrupted permit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify reviewed packages
        run: |
          sha256sum -c scripts/account-deletion-authorization/PACKAGE_SHA256SUMS
          sha256sum -c scripts/account-deletion-restore/PACKAGE_SHA256SUMS
      - name: Rehearse on network-isolated PostgreSQL 18.7
        run: |
          docker pull postgres:18.7-alpine
          bash scripts/account-deletion-restore/rehearse-local.sh --post-0027 --lost-arm
