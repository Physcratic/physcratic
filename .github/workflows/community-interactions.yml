name: Community interactions browser
on:
  pull_request:
    paths:
      - 'components/community/problem-interactions.tsx'
      - 'lib/community/problem-interactions*'
      - 'lib/community-problem-interactions.test.ts'
      - 'app/api/community/problem-stats/**'
      - 'components/physics/unified-arena-collection.tsx'
      - 'components/authored/student-page-client.tsx'
      - 'app/dashboard/problems/**'
      - 'tests/problem-interactions*'
      - 'migrations/0012_*'
      - '.github/workflows/community-interactions.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: physcratic_authoring_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTHORING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/physcratic_authoring_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: External browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/community-tools" --no-audit --no-fund playwright@1.64.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/community-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real component and API on disposable PostgreSQL
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/community-tools
        run: node --require ./tests/server-only-register.cjs --import tsx tests/problem-interactions.browser.mjs
