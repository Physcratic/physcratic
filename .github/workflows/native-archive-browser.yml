name: Native archive browser
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      NATIVE_SHARD: ${{ matrix.shard }}
      NATIVE_SHARDS: '8'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/native-tools" --no-audit --no-fund playwright@1.64.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/native-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Guest fields and solution comparison
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/native-tools
          NATIVE_BROWSER_SESSION: guest
        run: node --require ./tests/server-only-register.cjs --import tsx tests/native-olympiad.browser.mjs
      - name: Verified session isolation
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/native-tools
        run: node --require ./tests/server-only-register.cjs --import tsx tests/native-olympiad.browser.mjs
      - name: Retained PDF reader regression
        if: matrix.shard == 0
        env:
          AUTHORING_BROWSER_TOOLS: ${{ runner.temp }}/native-tools
          NATIVE_PDF_FIXTURES: '1'
          PDF_EVIDENCE: work/pdf-evidence
        run: node --require ./tests/server-only-register.cjs --import tsx tests/native-olympiad.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-archive-${{ matrix.shard }}
          path: |
            work/native-*.png
            work/pdf-evidence
          if-no-files-found: warn
